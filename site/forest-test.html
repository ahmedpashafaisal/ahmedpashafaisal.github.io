<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forest test</title>
  <!-- Dev only (npm run dev → /forest-test.html). Not a build input, never deployed.
       Forest world step 2: Kie sprites (forest-test/atlas.webp) placed by code on a
       canvas, clearing sized to the window, campfire under the button, trees sway
       under the pointer, day and night. Fonts and button are placeholders. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet" />
</head>
<body>
  <canvas class="forest" aria-hidden="true"></canvas>
  <div class="forest-night" aria-hidden="true"></div>
  <div class="fox-layer" aria-hidden="true"></div>

  <div class="ft-bar" role="toolbar" aria-label="Test options">
    <span class="ft-group"><b>Time</b>
      <button data-k="time" data-v="day">Day</button><button data-k="time" data-v="night">Night</button></span>
    <span class="ft-group"><b>Button</b>
      <button data-k="kit" data-v="lime">Lime</button><button data-k="kit" data-v="amber">Amber</button><button data-k="kit" data-v="wood">Wood</button><button data-k="kit" data-v="parchment">Parchment</button></span>
    <span class="ft-group"><button data-k="reroll">New forest</button></span>
  </div>

  <main class="ft-clearing">
    <h1 class="ft-name">Ahmed Pasha Faisal</h1>
    <p class="ft-line"><span>Game Producer</span><span class="ft-sep" aria-hidden="true">·</span> <span>Game Designer</span><span class="ft-sep" aria-hidden="true">·</span> <span>Narrative Designer</span></p>
    <button class="juicy-btn ft-btn" type="button">See games</button>
  </main>

  <div class="ft-bar ft-bar--fox" role="toolbar" aria-label="Fox test">
    <span class="ft-group"><b>Fox</b>
      <button data-fox="run">Run</button><button data-fox="pounce">Crouch and pounce</button><button data-fox="happy">Happy</button><button data-fox="fall">Fall over</button><button data-fox="sit">Sit</button></span>
    <span class="ft-group"><button data-fox="slow" aria-pressed="false">Slow motion</button></span>
  </div>

  <script type="module">
    import './src/styles/tokens.css';
    import './src/styles/base.css';
    import './src/styles/button.css';
    import './src/styles/theme.css';
    import './forest-test/forest.css';
    import './forest-test/fox.css';
    import './forest-test/fox-stage.js';
    import './forest-test/forest.js';
  </script>
</body>
</html>
