<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Map look test</title>
  <!-- Dev only (npm run dev → /map-test.html). Not a build input, never deployed.
       Step 6a: the deck as a map, 2D vs 3D, ways to light up a stop, whole
       board vs camera following the car. Props: map-test/kenney (CC0). -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet" />
</head>
<body>
  <canvas class="dot-grid" aria-hidden="true"></canvas>

  <div class="mt-bar" role="toolbar" aria-label="Test options">
    <span class="mt-group"><b>Look</b>
      <button data-k="view" data-v="2d">2D</button><button data-k="view" data-v="3d">3D</button></span>
    <span class="mt-group"><b>Light up</b>
      <button data-k="light" data-v="spot">Spotlight</button><button data-k="light" data-v="pop">Pop</button><button data-k="light" data-v="dim">Dim the rest</button></span>
    <span class="mt-group"><b>Camera</b>
      <button data-k="camera" data-v="whole">Whole map</button><button data-k="camera" data-v="follow">Follow car</button></span>
  </div>

  <header class="mt-intro">
    <h1>Map look test</h1>
    <p>Scroll down: the car drives from game to game. Or click a place: it drives there the same way.</p>
  </header>

  <section class="map" aria-labelledby="map-title">
    <h2 id="map-title" class="visually-hidden">All games</h2>
    <div class="map__stage">
      <div class="map__view">
        <div class="map__labels"></div>
      </div>
      <aside class="map__card" aria-live="polite"></aside>
    </div>
  </section>

  <footer class="mt-after"><p>After the map (footer)</p></footer>

  <script type="module">
    import './src/styles/tokens.css';
    import './src/styles/base.css';
    import './src/styles/theme.css';
    import './map-test/map.css';
    import { initDotGrid } from './src/js/dotgrid.js';
    initDotGrid(document.querySelector('.dot-grid'));
    import('./map-test/stage.js');
  </script>
</body>
</html>
